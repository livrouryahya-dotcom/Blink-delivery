<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlinK Delivery - Yami Yami Sushi</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">⚡ BlinK</div><button id="cartBtn">🛒 السلة <span id="cartCount">0</span></button></header>
<main>
<section class="hero"><div class="restaurant-title">🍣 Yami Yami Sushi</div><h1>منيو Yami Yami Sushi</h1><p>اختر طلبك من القائمة وأضفه إلى السلة.</p><input id="search" type="search" placeholder="ابحث عن طبق..."></section>
<section><h2>🍱 الأطباق</h2><div id="products" class="grid"></div></section>
</main>
<aside id="cart" class="cart"><button id="closeCart" class="close">✕</button><h2>سلة الطلب</h2><div id="cartItems"></div><div class="total">المجموع: <strong id="total">0</strong> درهم</div><input id="address" placeholder="اكتب عنوان التوصيل"><button id="checkout" class="primary">تأكيد الطلب</button></aside>
<div id="message" class="message"></div><script src="app.js"></script>
</body></html>
